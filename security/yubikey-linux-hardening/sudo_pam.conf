# /etc/pam.d/sudo drop-in configuration for YubiKey PAM U2F Hardware 2FA
# Canonical Guide: https://techloverhd.com/2026/11/best-yubikey-for-android-and-linux/
#
# Instructions:
# 1. Generate user mappings:
#    mkdir -p ~/.config/Yubico
#    pamu2fcfg -N -o pam://yubi-sudo > ~/.config/Yubico/u2f_keys
#
# 2. Append additional backup keys:
#    pamu2fcfg -N -o pam://yubi-sudo -n >> ~/.config/Yubico/u2f_keys
#
# 3. Add this line directly ABOVE '@include common-auth' in /etc/pam.d/sudo:
auth       required   pam_u2f.so origin=pam://yubi-sudo cue
