services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /opt/uptime-kuma/data:/app/data
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    container_name: uptime-kuma-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
