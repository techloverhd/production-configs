server {
    listen 80 default_server;
    server_name example.com www.example.com;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Immutable hashed Next.js bundles (1-year cache)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 2. Static media & fonts (30-day cache + 1-day background revalidation)
    location ~* \.(?:svg|ico|webp|avif|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 3. HTML routes (10-minute edge cache + 24h stale-while-revalidate + 24h stale-if-error)
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400, stale-if-error=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
