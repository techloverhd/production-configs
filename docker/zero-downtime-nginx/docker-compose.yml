services:
  frontend-web:
    image: nginx:1.27-alpine
    container_name: frontend-web
    restart: unless-stopped
    volumes:
      # Mount the dedicated production directory, NOT the staging build directory
      - ./live_out:/usr/share/nginx/html:ro
      # Mount the config directory so inode replacements are detected on reload
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    environment:
      - VIRTUAL_HOST=example.com,www.example.com
      - VIRTUAL_PORT=80
    networks:
      - web-proxy-network

networks:
  web-proxy-network:
    external: true
