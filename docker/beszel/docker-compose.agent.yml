services:
  beszel-agent:
    image: henrygd/beszel-agent:0.21.2
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      HUB_URL: https://beszel.example.com
      TOKEN: "<universal_or_system_token>"
      KEY: "<ed25519_public_key_from_hub>"
      DISABLE_SSH: "false"
